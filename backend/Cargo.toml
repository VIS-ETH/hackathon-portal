[workspace]
resolver = "2"
members = ["api", "cli", "repositories", "services"]

[workspace.dependencies]
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
config = "0.15.11"
derive_more = { version = "2.0.1", features = ["full"] }
directories = "6.0.0"
dotenvy = "0.15.7"
hackathon-portal-repositories = { path = "repositories" }
hackathon-portal-services = { path = "services" }
itertools = "0.15.0"
mime = "0.3.17"
sea-orm = { version = "1.1.12", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "with-json",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
serde_with = "3.12.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
utoipa = { version = "4.2.3", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.17.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# correctness, suspicious, style, complexity and perf keep clippy's default levels
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# pedantic
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"

# cargo: crates are not published, duplicate versions come from transitive deps
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# perf
result_large_err = "allow"

# restriction
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
renamed_function_params = "deny"
unwrap_used = "deny"
ref_patterns = "warn"
print_stdout = "warn"
print_stderr = "warn"
